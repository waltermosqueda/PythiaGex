name: Publicar panel

# Ojo con esto: GitHub NO dispara workflows desde los push que hace el propio
# GITHUB_TOKEN, para evitar bucles infinitos. El workflow de datos commitea con
# ese token, asi que sus commits nunca disparaban este deploy: el dato quedaba
# en el repositorio pero el sitio publicado seguia viejo hasta que alguien
# pusheara a mano. Verificado el 2026-08-31: el bot commiteo 09:57 y el ultimo
# deploy era de las 07:45.
#
# Se resolvio fusionando la publicacion adentro del workflow de datos, que
# ademas cuesta la mitad: GitHub factura por minuto empezado, asi que dos
# trabajos de menos de un minuto se cobraban como dos minutos enteros.
#
# Este workflow queda solo para publicar a mano o cuando se edita el panel
# directamente, sin recalcular datos.
on:
  push:
    branches: [main]
    paths: ['panel/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # los scripts salen con el sha del commit en la url: el navegador no puede quedarse con un app.js
      # viejo (Pages cachea 10 min y una pagina nueva con scripts viejos dibuja cualquier cosa)
      - name: Versionar los scripts con el sha
        run: |
          python3 - <<'PY'
          import os, re
          p = "panel/index.html"; s = open(p, encoding="utf-8").read()
          sha = os.environ["GITHUB_SHA"][:8]
          s2 = re.sub(r'src="([a-z]+\.js)"', lambda m: 'src="%s?v=%s"' % (m.group(1), sha), s)
          assert s2.count("?v=" + sha) >= 4, "no se versionaron los scripts"
          open(p, "w", encoding="utf-8").write(s2); print(s2.count("?v=" + sha), "scripts versionados con", sha)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: panel
      - id: deploy
        uses: actions/deploy-pages@v4
