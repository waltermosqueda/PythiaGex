name: Cadenas minuto a minuto

# EL ARCHIVO DE CADENAS, CADA MINUTO, EN SU PROPIA RAMA.
#
# El ciclo grande (actualizar.yml) tarda ~2,5 minutos y ademas de la cadena
# calcula, dibuja y publica. Para el backtest hace falta otra cosa, mas simple
# y mas seguida: bajar la cadena de CBOE, medir la base y anotar UNA linea por
# minuto en el archivo del dia. Eso es lo unico que hace este flujo.
#
# Los datos van a la rama "cadenas", no a main: son ~16 KB comprimidos por
# minuto y por raiz (unos 10 MB por dia), y a main lo hundirian. La rama se
# aplana a un solo commit todas las noches (22 UTC) para que el repo no crezca
# con la historia de los commits, solo con los datos. El indicador (Gamma Hoy,
# Fuente = Archivo / Hibrido) baja los dias que le faltan desde
# https://raw.githubusercontent.com/waltermosqueda/PythiaGex/cadenas/
on:
  schedule:
    - cron: '* 13-21 * * 1-5'     # rueda americana (13:30-21:00 UTC), cada minuto
    - cron: '*/5 0-12,22,23 * * 1-5'   # el resto del dia, cada 5
    - cron: '*/5 22,23 * * 0'     # la reapertura del domingo
  workflow_dispatch:

concurrency:
  group: cadenas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archivar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cadenas
          path: cadenas
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -q -r requirements.txt

      - name: Bajar la cadena de CBOE y anotar el minuto
        run: |
          python archivar_cadena.py --bajar ES NQ QQQ --destino cadenas || echo "no se pudo archivar"
          ls -la cadenas | tail -5

      # EL ESTADO DE GAMMA HOY, CALCULADO ACA (estado_nube.py): la misma cuenta del indicador,
      # sobre la cadena recien bajada, mas las velas de Yahoo del futuro y del indice. Es lo
      # que la web (panel/) muestra cuando la PC del operador esta apagada. Escribe
      # estado-<RAIZ>.json, velas-<RAIZ>.json y serie-<RAIZ>-<dia>.jsonl en la misma rama.
      - name: Estado de Gamma Hoy en la nube
        run: |
          python estado_nube.py --destino cadenas ES NQ || echo "el estado fallo"

      - name: Guardar en la rama cadenas
        run: |
          cd cadenas
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "sin cambios"; exit 0; fi
          git commit -q -m "cadenas: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # a las 22 UTC la rama se aplana: un solo commit con todos los archivos
          if [ "$(date -u '+%H')" = "22" ] && [ "$(git rev-list --count HEAD)" -gt 50 ]; then
            git checkout -q --orphan plana
            git add -A
            git commit -q -m "cadenas: aplanado $(date -u '+%Y-%m-%d')"
            git branch -D cadenas
            git branch -m cadenas
            git push -q -f origin cadenas
          else
            git pull -q --rebase origin cadenas || true
            git push -q origin cadenas
          fi
