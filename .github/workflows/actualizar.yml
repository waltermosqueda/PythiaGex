name: Actualizar datos

# ES opera casi 24 horas: domingo 18:00 ET hasta viernes 17:00 ET, con una
# pausa diaria de una hora. Se cubria solo la rueda americana y quedaba un
# hueco de catorce horas. Auditado el 2026-08-31 a las 09:52 UTC: CBOE estaba
# refrescando la cadena de SPX cada UN minuto, y nosotros sin correr desde las
# 21:00 del dia anterior. Se corrigio el horario.
#
# Los minutos de Actions son gratis en repos publicos, asi que el limite es el
# sentido comun, no el costo: cada 15 minutos alrededor de la rueda americana
# y cada 30 el resto.
on:
  schedule:
    - cron: '*/15 12-22 * * 1-5'   # rueda americana, cubre verano e invierno
    - cron: '*/30 0-11 * * 1-5'    # asiatica y europea
    # La reapertura de Globex. En verano ES abre el domingo a las 22:00 UTC
    # (17:00 de Chicago) y en invierno a las 23:00, porque Chicago cambia la
    # hora y UTC no. Cubrir las dos horas es lo unico que hace que el
    # calendario funcione todo el ano sin tocarlo en noviembre.
    - cron: '*/30 22,23 * * 0-4'
  workflow_dispatch:                # y a mano cuando haga falta

concurrency:
  group: datos
  cancel-in-progress: false

# Publicar Pages necesita estos tres. Antes vivian en un workflow aparte y
# eso costaba el doble: GitHub factura por MINUTO EMPEZADO, asi que un ciclo
# de 53 segundos reales partido en dos trabajos se cobraba como 2 minutos.
# Fusionado, el mismo ciclo cuesta 1.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  correr:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # LAS CADENAS DE LA CORRIDA ANTERIOR, PARA PODER RESTAR VOLUMENES.
      #
      # Los BigTrades salen de restar el volumen acumulado de dos corridas.
      # En un runner nuevo no hay corrida anterior, asi que sin esto la nube
      # no detectaria NUNCA una sola operacion grande y el archivo saldria
      # perfecto igual, con la lista vacia.
      #
      # Va por el cache de Actions y no por el repo a proposito: son 1,8 MB
      # comprimidos por simbolo y commitearlos cada quince minutos llenaria
      # el historial de git de datos que no se leen dos veces.
      - name: Recuperar cadenas anteriores
        uses: actions/cache/restore@v4
        with:
          path: datos/cache
          key: cadenas-${{ github.run_id }}
          restore-keys: cadenas-

      - name: Calcular exposiciones
        run: |
          for S in SPX NDX RUT; do
            echo "--- $S ---"
            python cli.py "$S" --dias 18 --matriz --rango 0.03 || echo "fallo $S"
            sleep 3
          done

      - name: Copiar al panel
        run: |
          mkdir -p panel/datos
          for S in _SPX _NDX _RUT; do
            [ -f "datos/salida/$S.json" ] && cp "datos/salida/$S.json" "panel/datos/$S.json"
          done
          # el panel abre SPX por defecto
          [ -f panel/datos/_SPX.json ] && cp panel/datos/_SPX.json panel/datos.json
          # extracto liviano que consume el indicador de ATAS
          mkdir -p panel/datos/atas
          cp datos/salida/atas/*.json panel/datos/atas/ 2>/dev/null || true
          ls -la panel/datos/ panel/datos/atas/

      # DOMINANTES Y BIGTRADES.
      #
      # Se corre DOS VECES con una pausa corta en el medio, y las dos sirven
      # para cosas distintas:
      #
      #   la primera   resta contra la corrida del ciclo anterior, que quedo
      #                en el cache. Ventana de unos quince minutos: cubre toda
      #                la rueda, pero el lado sale con confianza baja porque en
      #                quince minutos entra de todo y el ultimo precio ya no
      #                representa al conjunto.
      #
      #   la segunda   resta contra la primera. Ventana de ochenta segundos:
      #                cubre poco, pero ahi el lado se puede afirmar.
      #
      # Las dos escriben en el mismo historial del dia y cada evento lleva su
      # propia confianza, asi que no se mezclan sin avisar.
      - name: Dominantes y BigTrades
        run: |
          for S in SPX NDX RUT; do
            python radar.py "$S" || echo "fallo el radar de $S"
            sleep 2
          done
          sleep 80
          for S in SPX NDX RUT; do
            python radar.py "$S" || echo "fallo el radar corto de $S"
            sleep 2
          done
          ls -la panel/datos/atas/ 2>/dev/null || true

      # Se guarda solo lo reciente: el cache no es un archivo historico, es el
      # eslabon anterior de la cadena. Sin la poda crece sin techo y la
      # restauracion se vuelve mas lenta que bajar el dato de nuevo.
      - name: Podar el cache de cadenas
        run: |
          find datos/cache -name '*.json.gz' -mmin +90 -delete 2>/dev/null || true
          du -sh datos/cache 2>/dev/null || true

      - name: Guardar cadenas para el proximo ciclo
        uses: actions/cache/save@v4
        with:
          path: datos/cache
          key: cadenas-${{ github.run_id }}

      # LA AUDITORIA DE CALCULOS, EN CADA CICLO.
      #
      # Recalcula once controles desde la cadena cruda de CBOE sin reusar
      # ninguna funcion del proyecto: si un error estuviera en el pipeline, la
      # unica forma de verlo es rehacer la cuenta por otro camino. Hasta ahora
      # se corria a mano, o sea casi nunca, y los errores los encontraba el
      # operador en vivo.
      #
      # No se detiene el ciclo si falla: el dato igual se publica, pero queda
      # el registro y el resumen aparece en el log de la corrida. Un auditor
      # que ademas corrige deja de ser auditor; lo suyo es avisar fuerte.
      - name: Auditoria de calculos
        run: |
          python auditoria.py 2>&1 | tail -40 || echo "la auditoria fallo"

      # El centinela mide si lo que el indicador prometio paso de verdad.
      # Corre en cada ciclo para ir juntando observaciones (no baja nada: usa
      # la serie de precio que cli.py acaba de archivar), y escribe la
      # conclusion en la bitacora una sola vez por dia, despues del cierre
      # de 16:00 ET, cuando la rueda ya se puede juzgar entera.
      - name: Centinela
        run: |
          HORA=$(date -u '+%H')
          if [ "$HORA" = "21" ] || [ "$HORA" = "20" ]; then
            python centinela.py --informe || echo "centinela fallo"
          else
            python centinela.py || echo "centinela fallo"
          fi

      - name: Podar historico viejo
        run: |
          # se guardan 30 dias; lo anterior se borra para que el repo no crezca
          find datos/historico -name '*.jsonl' -mtime +30 -delete 2>/dev/null || true
          # las series de precio pesan mas: se guardan 90 dias, que es el
          # horizonte con el que el centinela puede sacar alguna conclusion
          find datos/historico -name 'precio-*.json' -mtime +90 -delete 2>/dev/null || true
          du -sh datos/ 2>/dev/null || true

      - name: Guardar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/datos.json panel/datos panel/datos/atas datos/historico conocimiento/centinela datos/auditoria 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "datos: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      # La publicacion va en el MISMO trabajo. Separada costaba un minuto
      # facturado de mas por ciclo, y ademas metia una espera entre que el
      # dato se calculaba y llegaba a la pantalla.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: panel
      - id: deploy
        uses: actions/deploy-pages@v4
